<div class="read-more">
  <div class="read-more__intro">
    <ng-content select="[read-more-intro]"></ng-content>
  </div>

  @if (readMoreContent && expanded) {
    <div class="read-more__content">
      <ng-content select="[read-more-content]"></ng-content>
    </div>
  }

  @if (readMoreContent) {
    <button class="read-more__button" (click)="toggleContent()">
      <ehh-icon [icon]="icon"></ehh-icon>
      <span>{{ buttonText }}</span>
    </button>
  }
</div>
