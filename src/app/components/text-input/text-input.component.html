<label class="text-input">
  <span class="text-input__label">{{ label }}</span>
  @if (type === 'text') {
    <input
      type="text"
      (input)="inputChanged($event)"
      [value]="value"
      ehhIosZoom>
  }
  @if (type === 'textarea') {
    <textarea
      [value]="value"
    (input)="inputChanged($event)"></textarea>
  }
</label>
