@for (exercise of exercises; track exercise; let index = $index) {
  <div class="topic-exercises">
    <ehh-forward-button
      [title]="exercise.title"
      [count]="exercise.topic_ord + '.' + exercise.ord"
      (click)="openExercise(exercise.topic_id, exercise.id)"
    >
    </ehh-forward-button>
  </div>
}
