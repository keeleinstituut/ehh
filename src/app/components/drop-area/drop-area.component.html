<span class="drop-area">
  <span
    [id]="dropAreaId"
    cdkDropList
    [cdkDropListData]="dropData"
    [cdkDropListConnectedTo]="connectedTo"
    [cdkDropListEnterPredicate]="limitItem"
    (cdkDropListDropped)="drop($event)"
    class="drop-area__container">
    <span
      cdkDrag
      [class.drop-area__value]="dropData.length > 0" [cdkDragDisabled]="dragDisabled">
      <span
        [class.drop-area__drag-element]="dropData.length > 0"
        (click)="playAudio(dropData[0].wav)">
        {{ dropData[0]?.text }}
        @if (dropData[0]?.wav?.length) {
          <ehh-icon icon="sound_3"></ehh-icon>
        }
      </span>
      <span class="drop-area__placeholder" *cdkDragPlaceholder></span>
    </span>
  </span>
</span>
