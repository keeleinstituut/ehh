@if (opened) {
  <div>
    <div class="menu" cdkTrapFocus [cdkTrapFocusAutoCapture]="true">
      <div class="menu__container">
        <div class="menu-content">
          <div class="menu-content__header">
            <div class="menu__close">
              <ehh-button
                variant="plain"
                icon="close"
                size="large"
              (click)="close()">Sulge</ehh-button>
            </div>
          </div>
          <nav class="menu-content__list">
            <ul>
              <li>
                <a target="blank" href="https://sonaveeb.ee/wordgame">Piltsõnastik</a>
              </li>
              <li>
                <a href="javascript:void(0)" (click)="openModal.emit()">Tagasiside</a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </div>
    <div
      class="backdrop"
      role="button"
      tabindex="0"
      aria-label="Sulge menüü"
      (click)="close()"
      (keydown.enter)="close()"
      (keydown.space)="$event.preventDefault(); close()"></div>
  </div>
}
